name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ '8.0.x', '9.0.x', '10.0.x' ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit Tests
        run: dotnet test tests/Qorpe.Mediator.UnitTests/ --no-build --configuration Release --verbosity normal

      - name: Integration Tests
        run: dotnet test tests/Qorpe.Mediator.IntegrationTests/ --no-build --configuration Release --verbosity normal

      - name: Analyzer Tests
        run: dotnet test tests/Qorpe.Mediator.Analyzers.Tests/ --no-build --configuration Release --verbosity normal

      - name: Source Generator Tests
        run: dotnet test tests/Qorpe.Mediator.SourceGenerator.Tests/ --no-build --configuration Release --verbosity normal

      - name: Load Tests
        run: dotnet test tests/Qorpe.Mediator.LoadTests/ --no-build --configuration Release --verbosity normal
        timeout-minutes: 5

  native-aot:
    name: Native AOT publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Publishes the IsAotCompatible sample as a native binary (no JIT). The build fails on any
      # trim/AOT warning, so a successful publish proves the generated dispatch is AOT-safe.
      - name: Publish Native AOT sample
        run: dotnet publish tests/Qorpe.Mediator.AotSample/Qorpe.Mediator.AotSample.csproj -c Release -r linux-x64 -p:PublishAot=true -o ./aot-out

      - name: Run native binary and verify output
        run: |
          output="$(./aot-out/Qorpe.Mediator.AotSample)"
          echo "$output"
          echo "$output" | grep -q "AOT-SAMPLE-OK"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test with Coverage
        run: |
          dotnet test tests/Qorpe.Mediator.UnitTests/ \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --configuration Release

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml
