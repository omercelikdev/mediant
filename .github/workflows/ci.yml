name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ '8.0.x', '9.0.x', '10.0.x' ]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit Tests
        run: dotnet test tests/Mediant.UnitTests/ --no-build --configuration Release --verbosity normal

      - name: Integration Tests
        run: dotnet test tests/Mediant.IntegrationTests/ --no-build --configuration Release --verbosity normal

      - name: Analyzer Tests
        run: dotnet test tests/Mediant.Analyzers.Tests/ --no-build --configuration Release --verbosity normal

      - name: Source Generator Tests
        run: dotnet test tests/Mediant.SourceGenerator.Tests/ --no-build --configuration Release --verbosity normal

      - name: EF Core Tests
        run: dotnet test tests/Mediant.EntityFrameworkCore.Tests/ --no-build --configuration Release --verbosity normal

      - name: Load Tests
        run: dotnet test tests/Mediant.LoadTests/ --no-build --configuration Release --verbosity normal
        timeout-minutes: 5

  native-aot:
    name: Native AOT publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Publishes the IsAotCompatible sample as a native binary (no JIT). The build fails on any
      # trim/AOT warning, so a successful publish proves the generated dispatch is AOT-safe.
      - name: Publish Native AOT sample
        # PublishAot is set in the sample's .csproj (not here) so it does not flow to the
        # netstandard2.0 source-generator project reference, which cannot be AOT-published.
        run: dotnet publish tests/Mediant.AotSample/Mediant.AotSample.csproj -c Release -r linux-x64 -o ./aot-out

      - name: Run native binary and verify output
        run: |
          output="$(./aot-out/Mediant.AotSample)"
          echo "$output"
          echo "$output" | grep -q "AOT-SAMPLE-OK"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test with Coverage
        run: |
          dotnet test tests/Mediant.UnitTests/ \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --configuration Release

      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml
